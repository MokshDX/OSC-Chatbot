  # --------------------------------------------------------------- abstention
  #
  # These are not trick questions. Every one is something a developer would
  # reasonably ask *these files* and not get an answer to, because the schema
  # documents deliberately push architecture, routes, events, UX and operational
  # concerns into a README that is not part of this corpus. Without these cases the
  # evaluation rewards a model that answers everything confidently.

  - id: abstain-http-routes
    question: What HTTP routes does the cart discount module expose?
    must_abstain: true
    tags: [abstention, out-of-scope]

  - id: abstain-pricing-plan-cost
