# OSC golden set — the single-turn suite for the authoritative schema corpus.
#
# Scored against `docs/company/schema/`, which is the production knowledge source
# (`corpus.root` in the active profile). The FAQ suite in `faq.yaml` is scored
# against a different corpus and is not comparable to this one; see the header there.
#
# Four rules were followed writing this, and each exists because breaking it
# produces a number that looks fine and measures nothing:
#
#   1. **Questions are phrased the way an engineer would ask them**, not copied from
#      the headings or the table cells. A golden set of verbatim headings measures
#      string matching and reports it as retrieval quality: every question scores
#      1.0 and the number never moves for a reason anyone can act on.
#
#   2. **`expected_facts` are short, distinctive and load-bearing** — a metafield
#      key, a namespace, a GID shape, a numeric limit. This corpus is unusually good
#      for that: `adt`, `cartTransformId`, `registractionForm` and
#      `IDEMPOTENCY_WINDOW_MS` are strings that appear nowhere else and cannot be
#      produced by a plausible-sounding guess. Anything longer would score the
#      model's phrasing rather than its correctness.
#
#   3. **Facts are drawn from the document body, not from the question.** A case
#      whose expected fact is a word the question already contains is scored on
#      echo, and an extractive model passes it without retrieving anything.
#
#   4. **Abstention cases name things this corpus genuinely does not cover.** These
#      documents are persistence schemas: they deliberately push architecture,
#      routes, events and UX into a README that is *not* in the corpus. That makes
#      honest unanswerable questions easy to write and realistic — they are the
#      questions a developer actually asks these files and does not get an answer to.
#
# `relevant_documents` are corpus-relative paths — the same string the filesystem
# loader records as `relative_path` on every chunk. `./osc documents` lists what is
# actually indexed.

version: 1
corpus: docs/company/schema
description: >
  OSCP module persistence schemas — 63 answerable questions across all eleven
  documents, plus 18 abstention cases, including four held-out near misses.

