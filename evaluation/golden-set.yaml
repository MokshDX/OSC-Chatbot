# OSC golden set — the questions every evaluation run is scored against.
#
# Curated against the real corpus in docs/company/. Two rules were followed when
# writing it, and both matter more than the case count:
#
#   1. Questions are phrased the way a merchant would ask them, not copied from the
#      FAQ headings. A golden set of verbatim headings measures string matching and
#      reports it as retrieval quality — every question would score 1.0 and the
#      number would move for no reason anyone could act on.
#
#   2. `expected_facts` are short, distinctive and load-bearing: a number, a limit,
#      a tag, a product name. Anything longer scores the model's phrasing rather
#      than its correctness, and would fail a perfectly good answer that used a
#      synonym.
#
# `relevant_documents` are corpus-relative paths under the ingest root
# (docs/company). Run `./osc documents` to see what is actually indexed.
#
# Abstention cases at the end are deliberate. Without them an evaluation rewards a
# model that answers everything, which is the failure mode this system is designed
# against.

version: 1
description: >
  OSCP Wholesale B2B knowledge assistant — 81 curated questions covering all
  seventeen FAQ topic areas, plus 5 abstention cases the corpus cannot answer.

