# Local Postgres with pgvector, for development and for running the integration
# tests. The application creates its own schema on first use.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osc_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osc_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
