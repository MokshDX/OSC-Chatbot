# Fully local: no corpus text leaves the host and no API credential is needed.
# Useful for offline experimentation and for evaluating data-residency constraints.
#
#   OSC_PROFILE=config/experiments/local-only.yaml osc-assistant ask "..."

llm:
  provider: ollama
  model: llama3.1:8b

fast_llm:
  provider: ollama
  model: llama3.1:8b

embeddings:
  provider: local
  model: BAAI/bge-small-en-v1.5
  options:
    query_prefix: "Represent this sentence for searching relevant passages: "

reranker:
  provider: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

vector_store:
  provider: pgvector
