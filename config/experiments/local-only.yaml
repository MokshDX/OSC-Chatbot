# Local, without Ollama: sentence-transformers in-process for embeddings, plus a
# cross-encoder reranker. The default profile is already fully local via Ollama —
# this one exists to exercise the second local embedding path and the reranker.
#
#   pip install -e ".[local]"
#   OSC_PROFILE=config/experiments/local-only.yaml osc-assistant search "expense limit"
#
# NOTE: bge-small-en-v1.5 is 384-dimensional against nomic-embed-text's 768. The
# chunks table fixes its vector width at migration time, so this profile needs its
# own database and a full re-index; it cannot share one with the default profile.

llm:
  provider: ollama
  model: qwen3:8b
  options:
    include_usage_in_stream: true
    extra_body:
      reasoning_effort: none

fast_llm:
  provider: ollama
  model: qwen3:8b
  options:
    extra_body:
      reasoning_effort: none

embeddings:
  provider: local
  model: BAAI/bge-small-en-v1.5
  options:
    # bge is asymmetric: queries expect this instruction prefix, documents do not.
    query_prefix: "Represent this sentence for searching relevant passages: "

reranker:
  provider: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

vector_store:
  provider: pgvector

database:
  dsn: postgresql://mokshdutt@localhost:5432/osc_local384
