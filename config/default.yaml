# Default profile.
#
# Every value here can be overridden by an environment variable using the OSC_
# prefix and a double underscore for nesting, e.g.:
#   OSC_LLM__PROVIDER=groq  OSC_LLM__MODEL=llama-3.3-70b-versatile
#
# To run an experiment, copy this file, change what you are testing, and point
# OSC_PROFILE at the copy. No code changes, no rebuild.
#
# Run `osc-assistant providers` for the full list of registered provider names.

workspace_id: default
environment: development
log_level: INFO
log_format: json

# Answer model. Anthropic is the default because it is the only provider that
# resolves citations against the source text rather than having the model assert
# them, which is the main defence against ungrounded answers.
llm:
  provider: anthropic
  model: claude-opus-5
  options:
    # Thinking is on by default on this model; a low effort level keeps latency and
    # cost down while retaining it. Remove this key for models that reject it.
    effort: low
    cache_system_prompt: true

# Cheap model for query rewriting, which sits on the critical path before retrieval.
fast_llm:
  provider: anthropic
  model: claude-haiku-4-5

# Chosen independently of the answer model. Changing this requires a full re-index.
embeddings:
  provider: openai_compatible
  model: text-embedding-3-large

vector_store:
  provider: pgvector

# Reranking is off until the evaluation harness can show the gain on OSC's own
# golden set. Switch to `cross_encoder` to measure it.
reranker:
  provider: noop

chunking:
  strategy: recursive
  chunk_size: 1200
  chunk_overlap: 150

retrieval:
  strategy: hybrid
  candidates: 40
  top_k: 8
  rrf_k: 60
  min_score: 0.0
  rewrite_queries: true

generation:
  max_tokens: 4096
  require_citations: true

database:
  dsn: postgresql://postgres:postgres@localhost:5432/osc_assistant
  min_pool_size: 1
  max_pool_size: 10

server:
  host: 127.0.0.1
  port: 8000
  cors_origins: []
