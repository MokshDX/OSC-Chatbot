# Default profile: fully local. Nothing in this configuration sends corpus text or
# questions off the host, and no API credential is required.
#
# Every value here can be overridden by an environment variable using the OSC_
# prefix and a double underscore for nesting, e.g.:
#   OSC_LLM__PROVIDER=groq  OSC_LLM__MODEL=llama-3.3-70b-versatile
#
# To run an experiment, copy this file, change what you are testing, and point
# OSC_PROFILE at the copy. No code changes, no rebuild.
#
# Run `osc-assistant providers` for the full list of registered provider names.

workspace_id: default
environment: development
# TRACE adds one record per pipeline stage — the firehose for `tail -f` debugging.
# DEBUG adds component construction and config resolution. INFO is the operational
# default: startup, requests, ingestion, generation, warnings and failures.
log_level: INFO
log_format: json

# Persistent logging. Tracing explains one execution; logging records everything
# that happened, survives the process, and is what you grep next week.
#
#   .osc/logs/osc.log     operational stream, rotates at max_bytes
#   .osc/logs/audit.log   one record per answered question, kept far longer
#
# Watch a request move through the pipeline live:
#   OSC_LOG_LEVEL=TRACE ./osc ask "..."  &  tail -f .osc/logs/osc.log
logging:
  directory: .osc/logs
  # Disk ceiling is max_bytes * (backup_count + 1) — roughly 60 MB here. The oldest
  # rotated file is deleted, not archived, so the log cannot grow without bound.
  max_bytes: 10000000
  backup_count: 5
  # Audit keeps more history than the operational stream, deliberately: a debug
  # firehose rotates in hours and "what did we answer in March" must outlive it.
  audit: true
  audit_max_bytes: 10000000
  audit_backup_count: 20
  # Off by default. Question, answer and chunk text are reduced to a character
  # count, which keeps every timing and count an investigation needs while keeping
  # corpus content out of a file that tends to get shipped elsewhere. Credentials
  # are redacted regardless and this flag cannot re-enable them.
  capture_payloads: false
  # One TRACE record per pipeline stage. Free at INFO — the record is built only
  # after the level check passes.
  log_spans: true

# Answer model: Qwen3 served by the local Ollama daemon, reached through the
# OpenAI-compatible adapter.
llm:
  provider: ollama
  model: qwen3:8b
  options:
    # Ollama reports token usage on the final stream chunk. Without this the
    # streaming path — which is what the API and the UI use — records zero tokens
    # for every request, making cost and context-budget analysis impossible.
    include_usage_in_stream: true
    extra_body:
      # Qwen3 is a hybrid reasoning model and thinks before answering by default,
      # spending completion tokens that never reach the user. Measured on this
      # deployment: 138 completion tokens with thinking versus 3 without, for the
      # same reply. Two reasons it is off here:
      #   1. Ollama loads this model with a 4096-token context. Thinking competes
      #      with the answer for that budget, and an exhausted budget returns
      #      empty content rather than a short answer.
      #   2. Grounded question answering over retrieved passages is mostly
      #      extractive, so the latency is not repaid.
      # Set this to "low" or "medium" to re-enable it, and raise generation.max_tokens
      # to match: the answerer reports a truncated answer rather than hiding it.
      reasoning_effort: none

# Used only when retrieval.rewrite_queries is enabled. Same model, because an 8B
# local model is already the cheap option and a second one would be a second load.
fast_llm:
  provider: ollama
  model: qwen3:8b
  options:
    extra_body:
      reasoning_effort: none

# Chosen independently of the answer model. Changing this changes the vector width
# and therefore requires a full re-index against a fresh chunks table.
# nomic-embed-text is a purpose-built retrieval embedder at 768 dimensions, which
# is comfortably inside pgvector's 2000-dimension HNSW index limit.
embeddings:
  provider: ollama
  model: nomic-embed-text

vector_store:
  provider: pgvector

# Reranking is off until the evaluation harness can show the gain on OSC's own
# golden set. Switch to `cross_encoder` to measure it — `min_score` is applied to
# first-stage scores, so enabling a reranker no longer risks discarding everything.
reranker:
  provider: noop

# Sized against the answer model's 4096-token context: roughly 225 tokens per
# chunk, five chunks of sources, leaving room for the system prompt and the answer.
# Raise both if you serve this model with a larger context.
chunking:
  strategy: recursive
  chunk_size: 900
  chunk_overlap: 120

retrieval:
  strategy: hybrid
  candidates: 30
  top_k: 5
  rrf_k: 60
  min_score: 0.0
  # Off by default. It resolves follow-up references ("what about the second one?")
  # but costs a second model call on the critical path, and its benefit has never
  # been measured against a golden set. Enable it together with an evaluation run.
  rewrite_queries: false

generation:
  # Must cover the answer plus any thinking the model does. 1500 keeps the whole
  # request inside a 4096-token context alongside five chunks of sources.
  max_tokens: 1500
  require_citations: true

database:
  dsn: postgresql://mokshdutt@localhost:5432/osc
  min_pool_size: 1
  max_pool_size: 10

server:
  host: 127.0.0.1
  port: 8000
  cors_origins: []

# Execution tracing. Every significant stage of ingestion and question answering is
# timed and recorded as a span, viewable with `--explain` on any command, or over
# HTTP at /api/traces from a running service.
observability:
  enabled: true
  # Recent traces held in memory for `osc-assistant trace` and /api/traces. Lost on
  # restart by design: this answers "what did that request just do?", not "what
  # happened last Tuesday". Durable traces belong in a collector.
  trace_buffer_size: 50
  # Upper bound on one trace, so a corpus-wide ingestion — several spans per
  # document — cannot grow without limit. Totals stay accurate past the cap.
  max_spans_per_trace: 500
  log_traces: true
  # Appends completed traces to a bounded JSONL file so they outlive the process.
  # Without this a one-shot CLI command's trace is gone the moment it exits, and
  # re-running to recreate it does not reproduce a non-deterministic generation.
  # `./osc traces` and `./osc trace <id>` read from it.
  persist_traces: true
  trace_dir: .osc
  # Rotation threshold. Two files are kept — the one being written and the one
  # before it — so the ceiling on disk is roughly twice this.
  max_trace_file_bytes: 5000000
  # Records questions, rewritten queries and answers in traces. Set false for a
  # corpus where a trace must not contain content: every timing, count and stage is
  # retained and only the text becomes a character count.
  capture_text: true
  # Serving traces over HTTP additionally requires environment == development, and
  # that check is not overridable here: traces carry question text and chunk ids,
  # and no endpoint on this service is authenticated yet.
  expose_traces: true
