<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSC Knowledge Assistant</title>
<!--
  Deliberately one self-contained file with no build step and no framework.

  It talks to the same public API as any other client: POST /api/chat, then read
  the SSE stream. Nothing here is imported by the backend, and the whole UI can be
  replaced by swapping this file — which is the expected path, since a richer
  client is planned.

  Two rules worth preserving on a rewrite:

  1. The `complete` event is authoritative. When it reports an abstention the
     client must discard the text it already rendered, because the assistant
     declined to answer.
  2. The conversation is server-held. This page keeps a `session_id`, never a
     transcript, and deletes the session on `pagehide`. A client that accumulates
     its own history and replays it should send `history` instead and omit
     `session_id` — the API takes one or the other, never both.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #646b7a; --line: #e3e6ec;
    --accent: #2f5bd8; --panel: #f7f8fa; --warn-bg: #fff8e6; --warn-line: #e8c96a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaee; --muted: #99a1b0; --line: #2a2e37;
      --accent: #7d9cff; --panel: #1c1f26; --warn-bg: #2a2415; --warn-line: #6b5a22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .turn { margin-bottom: 26px; }
  .q {
    font-weight: 600; margin-bottom: 10px;
    padding-left: 12px; border-left: 3px solid var(--accent);
  }
  .a { white-space: pre-wrap; }
  .a.pending { color: var(--muted); }
  .abstained {
    background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-radius: 6px; padding: 10px 12px; white-space: pre-wrap;
  }
  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sources h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px;
  }
  .src {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 13px;
  }
  .src .t { font-weight: 600; }
  .src .u {
    color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace;
    word-break: break-all;
  }
  .src .x { color: var(--muted); margin-top: 4px; }
  .cited { border-color: var(--accent); }
  .err {
    color: #b3261e; border: 1px solid #b3261e; border-radius: 6px; padding: 10px;
  }
  footer { border-top: 1px solid var(--line); padding: 12px 20px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>OSC Knowledge Assistant</h1>
  <span class="meta" id="meta">connecting…</span>
</header>

<main>
  <div class="wrap" id="log">
    <p class="empty">
      Ask a question about the indexed OSC documents. Answers are generated only
      from retrieved sources, with citations. If the corpus does not contain the
      answer, the assistant will say so rather than guess.
    </p>
  </div>
</main>

<footer>
  <form id="form">
    <input id="q" type="text" autocomplete="off" placeholder="e.g. How many days of annual leave do employees get?" required>
    <button id="send" type="submit">Ask</button>
  </form>
</footer>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");

fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("meta").textContent =
    `${h.llm.provider}:${h.llm.model} · ${h.embeddings.model} · ${h.vector_store.provider} · ${h.retrieval_strategy}`;
}).catch(() => { document.getElementById("meta").textContent = "health check failed"; });

// One server-held session per page load. The client keeps an id, not a transcript:
// history lives on the server, so a reload starts a clean conversation and closing
// the tab releases the memory. `keepalive` is what makes that last part work — an
// ordinary fetch is cancelled when the page goes away, and the session would then
// wait out its idle TTL instead.
let sessionId = null;
const sessionReady = fetch("/api/sessions", { method: "POST" })
  .then(r => r.ok ? r.json() : null)
  .then(body => { sessionId = body && body.session_id; })
  .catch(() => { sessionId = null; });

// `sendBeacon` cannot issue a DELETE, so this is fetch with `keepalive`, which is
// the same guarantee: the request outlives the document.
window.addEventListener("pagehide", () => {
  if (sessionId) fetch(`/api/sessions/${sessionId}`, { method: "DELETE", keepalive: true });
});

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function renderSources(container, results, citedIds) {
  container.replaceChildren();
  if (!results.length) return;
  container.appendChild(el("h3", null, `Sources (${results.length})`));
  results.forEach((r, i) => {
    const cited = citedIds.has(r.chunk_id);
    const box = el("div", cited ? "src cited" : "src");
    box.appendChild(el("div", "t", `[${i + 1}] ${r.title}${cited ? " — cited" : ""}`));
    box.appendChild(el("div", "u", r.source_uri));
    box.appendChild(el("div", "x", r.excerpt));
    container.appendChild(box);
  });
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  input.value = "";
  send.disabled = true;
  log.querySelector(".empty")?.remove();

  const turn = el("div", "turn");
  turn.appendChild(el("div", "q", question));
  const answer = el("div", "a pending", "…");
  const sources = el("div", "sources");
  turn.append(answer, sources);
  log.appendChild(turn);
  turn.scrollIntoView({ block: "start" });

  let text = "";
  let retrieved = [];
  const citedIds = new Set();

  try {
    // Wait for the session before the first turn, so question one is already part
    // of the conversation rather than an orphan the second turn cannot refer to.
    await sessionReady;
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // Only the new question goes on the wire. The server holds the history under
      // `session_id`, which is what makes a follow-up resolvable — and, when the
      // session could not be opened, degrades to the previous single-turn
      // behaviour rather than failing the request.
      body: JSON.stringify(sessionId ? { question, session_id: sessionId, stream: true }
                                     : { question, stream: true }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE frames are separated by a blank line; a partial frame stays buffered.
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const frame of frames) {
        const nameLine = frame.split("\n").find(l => l.startsWith("event: "));
        const dataLine = frame.split("\n").find(l => l.startsWith("data: "));
        if (!nameLine || !dataLine) continue;
        const name = nameLine.slice(7);
        const data = JSON.parse(dataLine.slice(6));

        if (name === "sources") {
          retrieved = data;
          renderSources(sources, retrieved, citedIds);
        } else if (name === "delta") {
          text += data.text;
          answer.className = "a";
          answer.textContent = text;
        } else if (name === "citation") {
          citedIds.add(data.chunk_id);
          renderSources(sources, retrieved, citedIds);
        } else if (name === "complete") {
          // Authoritative: replaces whatever streamed, including on abstention.
          answer.className = data.abstained ? "abstained" : "a";
          answer.textContent = data.text;
          data.citations.forEach(c => citedIds.add(c.chunk_id));
          renderSources(sources, data.abstained ? [] : retrieved, citedIds);
        } else if (name === "error") {
          answer.className = "err";
          answer.textContent = `${data.error}: ${data.detail}`;
        }
      }
    }
  } catch (error) {
    answer.className = "err";
    answer.textContent = String(error);
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.focus();
</script>
</body>
</html>
